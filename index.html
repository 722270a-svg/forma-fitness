function renderWork(){let st=stat(day),session=data.sessions[day]||{};return `<div class="days">${program.map((d,i)=>`<button class="daybtn ${day===i?'active':''}" onclick="chooseDay(${i})">${d.name}${(data.sessions[i]||{}).finished?' ✓':''}</button>`).join('')}</div><div class="grid"><div class="card"><div class="muted">Выполнено подходов</div><div class="stat">${st.done} / ${st.total}</div><div class="small muted">Пропущено: ${st.skipped} · Осталось: ${st.total-st.done-st.skipped}</div></div><div class="card"><div class="muted">Статус тренировки</div><div class="stat">${session.finished?'Завершена':session.started?'В процессе':'Не начата'}</div><div class="session-time">${session.started?'🕒 Начало: '+new Date(session.started).toLocaleString('ru-RU'): 'Время начала ещё не записано'}</div>${session.completedAt?`<div class="session-time">🏁 Конец: ${new Date(session.completedAt).toLocaleString('ru-RU')}</div>`:''}</div></div><div class="mini-progress"><i style="width:${st.total?Math.round(100*st.done/st.total):0}%"></i></div><div class="actions"><button class="btn" onclick="startWorkout()">▶ ${session.started?'Продолжить тренировку':'Начать тренировку'}</button><button class="btn secondary" onclick="startRest()">⏱ Отдых 1 мин</button><button class="btn secondary" onclick="setRest()">⚙ Таймер: ${data.restSeconds} сек</button></div><div class="rule">Перед первым тяжёлым упражнением — 2–3 разминочных подхода. В рабочих подходах оставляй 1–2 повтора в запасе. По программе базовым упражнениям обычно нужен отдых 2–3 минуты, изоляции — 60–90 секунд; таймер по твоему запросу запускается на <b>${data.restSeconds} секунд</b>, его можно изменить. После каждого упражнения: 🏈 «Пальцы 100», затем 💪 «Пресс 10». Отдельный комплекс «Пресс» в конце тренировки убран.</div><div class="card"><label style="font-size:15px;color:var(--text)"><input type="checkbox" style="width:19px;height:19px;vertical-align:middle;accent-color:var(--lime)" ${session.finished?'checked':''} onchange="finishWorkout(this.checked)"> Тренировка полностью завершена</label><p class="muted small">Можно завершить даже с пропущенными подходами: они останутся в дневнике.</p></div>${program[day].ex.map((ex,e)=>renderEx(ex,e)).join('')}<div class="actions"><button class="btn" onclick="finishWorkout(true)">✓ Завершить тренировку</button><button class="btn secondary" onclick="exportData()">Экспорт дневника (JSON)</button></div>`}
function renderEx(ex,e){let sets=getSets(day,e),extra=true,press=true;return `<div class="exercise"><div class="ex-head"><div class="ex-name-wrap"><small>${String(e+1).padStart(2,'0')} · ${ex[2]}</small><h3>${escapeHtml(ex[0])}</h3></div><div class="ex-tools"><button class="visual-btn" onclick="showExercise(${day},${e})" aria-label="Показать упражнение">▶ Техника</button><span class="pill">${sets.filter(s=>s.state==='done').length}/${sets.length} ✓</span></div></div><div class="ex-body"><details><summary>Как выполнять и зачем</summary><p class="muted">${escapeHtml(ex[3])} Цель: ${escapeHtml(ex[2].toLowerCase())}.</p></details><div class="small muted" style="margin:13px 0 5px">Нажимай статус подхода: <b>Не начат → Выполнен → Пропущен</b>. После выполнения запускается отдых.</div>${sets.map((s,i)=>`<div class="set-row"><div class="number">№ ${i+1}</div><label>Повторы<input type="number" min="0" step="1" value="${escapeHtml(s.reps)}" oninput="setField(${day},${e},${i},'reps',this.value)"></label><label>Вес, кг<input type="number" min="0" step="0.1" value="${escapeHtml(s.weight)}" oninput="setField(${day},${e},${i},'weight',this.value)"></label><button class="status ${s.state==='done'?'done':s.state==='skip'?'skip':''}" onclick="cycleStatus(${day},${e},${i})">${s.state==='done'?'✓ Сделан':s.state==='skip'?'✕ Не смог':'○ Не начат'}</button></div>`).join('')}<div class="actions"><button class="btn secondary" onclick="changeCount(${day},${e},1)">+ Подход</button><button class="btn secondary" onclick="changeCount(${day},${e},-1)" ${sets.length<=1?'disabled':''}>− Подход</button><button class="btn secondary" onclick="startRest()">⏱ 1 мин отдыха</button></div>${extra?`<div class="extras"><label><input type="checkbox" ${data.logs['ball-'+day+'-'+e]?'checked':''} onchange="setExtra('ball-${day}-${e}',this.checked)"> 🏈 1. Пальцы 100 — 100 перебросов футбольного мяча из руки в руку</label>${press?`<label><input type="checkbox" ${data.logs['press-'+day+'-'+e]?'checked':''} onchange="setExtra('press-${day}-${e}',this.checked)"> 💪 2. Пресс 10 — 10 повторений на пресс</label>`:''}</div>`:''}</div></div>`}
function ensure(d,e,s){const k=id(d,e,s);if(!data.logs[k])data.logs[k]={};return data.logs[k]}function setField(d,e,s,field,v){ensure(d,e,s)[field]=v;persist()}function cycleStatus(d,e,s){let o=ensure(d,e,s);o.state=o.state==='done'?'skip':o.state==='skip'?'':'done';if(o.state==='done'){if(!(data.sessions[d]||{}).started){data.sessions[d]={started:new Date().toISOString(),finished:false}}startRest()}persist();render()}function changeCount(d,e,delta){const current=getSets(d,e).length,next=Math.max(1,current+delta);data.logs['count-'+d+'-'+e]=next;persist();render()}function setExtra(k,v){data.logs[k]=v;persist()}function startWorkout(){unlockAudio();data.sessions[day]={...(data.sessions[day]||{}),started:(data.sessions[day]||{}).started||new Date().toISOString(),finished:false};persist();render();toast('Тренировка начата!')}function finishWorkout(v){if(v&&!(data.sessions[day]||{}).finished){let st=stat(day);data.history.push({day:day+1,started:(data.sessions[day]||{}).started||new Date().toISOString(),finishedAt:new Date().toISOString(),done:st.done,skipped:st.skipped,total:st.total,sets:program[day].ex.map((ex,e)=>({name:ex[0],sets:getSets(day,e)}))});}data.sessions[day]={...(data.sessions[day]||{}),started:(data.sessions[day]||{}).started||new Date().toISOString(),finished:v,completedAt:v?new Date().toISOString():null};persist();render();toast(v?'Тренировка отмечена выполненной!':'Тренировка снова в процессе')}
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}function setRest(){let n=prompt('Сколько секунд отдыхать между подходами?',data.restSeconds);if(n!==null&&Number(n)>=10&&Number(n)<=600){data.restSeconds=Number(n);persist();render()}}
function startRest(){unlockAudio();stopTimer();document.getElementById('timer').classList.remove('ended');remaining=data.restSeconds;paused=false;document.getElementById('timer').classList.remove('hidden');document.getElementById('timerCaption').textContent='Отдых между подходами';document.getElementById('pauseBtn').textContent='Пауза';tickDraw();timerStartedAt=Date.now();interval=setInterval(tick,200)}function tick(){if(paused)return;remaining=Math.max(0,data.restSeconds-Math.floor((Date.now()-timerStartedAt)/1000));tickDraw();if(remaining===0){clearInterval(interval);interval=null;document.getElementById('timerCaption').textContent='Отдых окончен — следующий подход!';document.getElementById('timer').classList.add('ended');playEndSignal();toast('Делай следующий подход!');try{let s=new SpeechSynthesisUtterance('Отдых закончен. Делай следующий подход!');s.lang='ru-RU';speechSynthesis.speak(s)}catch{}}}function tickDraw(){let m=String(Math.floor(remaining/60)).padStart(2,'0'),s=String(remaining%60).padStart(2,'0');document.getElementById('clock').textContent=`${m}:${s}`}function toggleTimer(){if(!interval)return;if(!paused){paused=true;document.getElementById('pauseBtn').textContent='Старт'}else{paused=false;timerStartedAt=Date.now()-(data.restSeconds-remaining)*1000;document.getElementById('pauseBtn').textContent='Пауза'}}function stopTimer(){if(interval)clearInterval(interval);interval=null;document.getElementById('timer').classList.add('hidden')}
function renderProfile(){let p=data.profile;let inputs=[['name','Имя','text'],['age','Возраст','number'],['height','Рост, см','number'],['weight','Вес, кг','number'],['waist','Талия, см','number'],['chest','Грудь, см','number'],['hips','Бёдра, см','number'],['arm','Плечо (обхват), см','number'],['thigh','Бедро (обхват), см','number'],['neck','Шея, см','number'],['bodyFat','InBody: жир, %','number'],['muscleMass','InBody: мышечная масса, кг','number'],['skeletalMuscle','InBody: скелетные мышцы, кг','number'],['visceralFat','InBody: висцеральный жир (уровень)','number'],['water','InBody: вода, %','number'],['bmi','InBody: ИМТ','number']];return `<div class="card"><h3>Анкета и анализ состава тела</h3><p class="muted">Данные сохраняются только в этом браузере.</p><div class="grid">${inputs.map(([k,label,t])=>`<label>${label}<input type="${t}" step="any" value="${escapeHtml(p[k])}" oninput="profileField('${k}',this.value)"></label>`).join('')}<label>Пол<select onchange="profileField('sex',this.value)">${['Мужчина','Женщина','Не указан'].map(x=>`<option ${p.sex===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Цель<select onchange="profileField('goal',this.value)">${['Набор мышечной массы','Снижение веса','Поддержание формы'].map(x=>`<option ${p.goal===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Спортзал<select onchange="profileField('gym',this.value)">${['Spirit Fitness','DDX','СССР','World Class','Другой / дома'].map(x=>`<option ${p.gym===x?'selected':''}>${x}</option>`).join('')}</select></label></div><p class="foot">Оборудование конкретных филиалов пока не проверяется автоматически.</p><div class="rule">📥 Чтобы загрузить измерение InBody: открой вкладку «Прогресс» → «Импортировать JSON» → выбери файл измерения. Тренировки и питание сохранятся.</div>${(data.inbodyRecords||[]).slice().reverse().map(r=>`<p class="muted">InBody ${escapeHtml(r.date)} · ${escapeHtml(r.profile.weight)} кг · мышцы ${escapeHtml(r.profile.skeletalMuscle)} кг · жир ${escapeHtml(r.profile.bodyFat)}%</p>`).join('')}</div>`}function profileField(k,v){data.profile[k]=v;persist()}

const dayNames=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function localDay(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function foodDate(){return data.foodDate||localDay()}
function weekdayFor(date){let d=new Date(date+'T12:00:00');return (d.getDay()+6)%7}
function nutrition(parts){return parts.reduce((a,[key,g])=>{let food=foods[key];if(!food)return a;let f=(+g||0)/100;return a.map((x,i)=>x+food[i+1]*f)},[0,0,0,0])}
function fmt(x){return (Math.round(x*10)/10).toLocaleString('ru-RU',{maximumFractionDigits:1})}
function getPlan(date){let n=weekdayFor(date);return mealDays[n].map(([name,parts],i)=>({id:'plan-'+date+'-'+i,name,parts:parts.map(x=>x.slice())}))}
function dayEntries(date){return (data.meals||[]).filter(m=>m.foodDate===date||(!m.foodDate&&m.date&&localDay(new Date(m.date))===date))}
function mealNutrition(m){return m.parts?nutrition(m.parts):[+(m.kcal||0),+(m.protein||0),+(m.fat||0),+(m.carbs||0)]}
function foodTotals(date){return dayEntries(date).reduce((a,m)=>a.map((v,i)=>v+mealNutrition(m)[i]),[0,0,0,0])}
function foodTarget(date){let workout=((data.foodWorkouts||{})[date]!=null?(data.foodWorkouts||{})[date]:([0,2,4].indexOf(weekdayFor(date))>=0));return {workout,kcal:workout?2600:2400,p:170,f:80,c:workout?300:250}}
function foodMeter(label,value,target,suffix='г'){let percentage=Math.min(100,target?100*value/target:0);return `<div class="food-meter"><div class="food-meter-head"><span>${label}</span><strong>${fmt(value)} / ${target} ${suffix}</strong></div><div class="food-track"><span style="width:${percentage}%"></span></div></div>`}
function renderFood(){let date=foodDate(),entries=dayEntries(date),totals=foodTotals(date),target=foodTarget(date),plan=getPlan(date).map(m=>({...m,parts:actualPlanParts(m)})),byId=Object.fromEntries(entries.map(m=>[m.planId,m]));let remain=Math.max(0,target.p-totals[1]);return `<div class="food-intro"><div class="small" style="color:var(--lime);letter-spacing:2px;font-weight:900">МОЁ ПИТАНИЕ</div><h2>Ешь. Отмечай. Расти.</h2><div class="muted">Белок и БЖУ рассчитываются по фактически отмеченным порциям.</div></div>
<div class="card"><div class="food-top"><label>Дата<input type="date" value="${date}" onchange="setFoodDate(this.value)"></label><label>Тип дня<select onchange="setFoodWorkout(this.value)"><option value="1" ${target.workout?'selected':''}>🏋️ Тренировка · 2600 ккал</option><option value="0" ${!target.workout?'selected':''}>🌿 Отдых · 2400 ккал</option></select></label></div><div class="protein-focus"><span>БЕЛКА ОСТАЛОСЬ НА СЕГОДНЯ</span><strong>${fmt(remain)} <small>г</small></strong><div class="muted small">Съедено ${fmt(totals[1])} из ${target.p} г${totals[1]>target.p?' · цель достигнута':''}</div></div>
${foodMeter('Белки',totals[1],target.p)}${foodMeter('Жиры',totals[2],target.f)}${foodMeter('Углеводы',totals[3],target.c)}${foodMeter('Калории',totals[0],target.kcal,'ккал')}<p class="foot">Цели из прежнего плана: Б 170 г, Ж 80 г; У 300 г в тренировочный и 250 г в день отдыха. Эти БЖУ дают 2600 / 2400 ккал соответственно; значения ориентировочные.</p></div>
<div class="section-heading"><h3>Меню на ${dayNames[weekdayFor(date)]}</h3><span>${plan.filter(m=>byId[m.id]).length}/${plan.length} приёмов отмечено</span></div>${plan.map(meal=>{let logged=byId[meal.id],parts=logged?logged.parts:meal.parts,nut=nutrition(parts);return `<div class="food-meal ${logged?'is-eaten':''}"><div class="meal-heading"><div><div class="small muted">${escapeHtml(meal.name)}</div><b>${parts.map(([k,g])=>`${escapeHtml((foods[k]||[])[0]||k)} ${fmt(g)} г`).join(' · ')}</b></div><button class="meal-check ${logged?'checked':''}" onclick="togglePlannedMeal('${meal.id}')" aria-label="${logged?'Убрать отметку':'Отметить как съеденное'}">${logged?'✓':'＋'}</button></div><div class="meal-macro">${fmt(nut[0])} ккал <span>Б ${fmt(nut[1])}</span><span>Ж ${fmt(nut[2])}</span><span>У ${fmt(nut[3])}</span></div><details><summary>Изменить порцию${logged?' (уже съедено)':''}</summary><div class="portion-edit">${parts.map(([key,g])=>`<label>${escapeHtml((foods[key]||[])[0]||key)}<input type="number" min="0" step="5" value="${g}" onchange="editPlanPortion('${meal.id}','${key}',this.value)"></label>`).join('')}</div></details></div>`}).join('')}

${entries.filter(m=>!m.planId).length?`<div class="card"><h3>Добавлено отдельно</h3>${entries.filter(m=>!m.planId).map(m=>`<div class="extra-food"><span>${escapeHtml(m.name)} · ${fmt(mealNutrition(m)[0])} ккал · Б ${fmt(mealNutrition(m)[1])} г</span><button class="btn secondary" onclick="removeFood('${m.id}')">Удалить</button></div>`).join('')}</div>`:''}
<div class="card"><h3>Неделя питания</h3><div class="food-week">${dayNames.map((d,i)=>`<button class="${i===weekdayFor(date)?'picked':''}" onclick="jumpFoodDay(${i})">${d}</button>`).join('')}</div><p class="foot">Меню — примерный шаблон на основе прежних целей и обычных продуктов из «Пятёрочки», а не точная копия ранее утверждённых блюд. КБЖУ примерные: сверяй с упаковкой. Вес сухих круп указан до варки, а мяса и рыбы — до приготовления.</p></div>`}
function setFoodDate(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;data.foodDate=date;persist();render()}
function jumpFoodDay(i){let d=new Date(foodDate()+'T12:00:00');d.setDate(d.getDate()+i-weekdayFor(foodDate()));setFoodDate(localDay(d))}
function setFoodWorkout(value){data.foodWorkouts=data.foodWorkouts||{};data.foodWorkouts[foodDate()]=value==='1';persist();render()}
function actualPlanParts(meal){let saved=(data.foodPortions||{})[meal.id];return meal.parts.map(([k,g])=>[k,saved&&saved[k]!==undefined?saved[k]:g])}
function togglePlannedMeal(planId){let date=foodDate(),meal=getPlan(date).find(m=>m.id===planId);if(!meal)return;let index=data.meals.findIndex(m=>m.planId===planId);if(index>=0)data.meals.splice(index,1);else{meal.parts=actualPlanParts(meal);data.meals.push({id:'meal-'+Date.now(),planId,foodDate:date,name:meal.name,parts:meal.parts,date:new Date().toISOString()})}persist();render()}
function editPlanPortion(planId,key,value){let meal=getPlan(foodDate()).find(m=>m.id===planId);if(!meal||!meal.parts.some(p=>p[0]===key))return;data.foodPortions=data.foodPortions||{};data.foodPortions[planId]=data.foodPortions[planId]||{};data.foodPortions[planId][key]=Math.max(0,Number(value)||0);let logged=data.meals.find(m=>m.planId===planId);if(logged)logged.parts=actualPlanParts(meal);persist();render()}
function addQuickFood(){let key=document.getElementById('foodQuickKey').value,g=Number(document.getElementById('foodQuickGrams').value);if(!foods[key]||!(g>0))return;data.meals.push({id:'extra-'+Date.now(),name:foods[key][0]+' '+fmt(g)+' г',parts:[[key,g]],foodDate:foodDate(),date:new Date().toISOString()});persist();render();toast('Продукт записан')}
function removeFood(id){data.meals=data.meals.filter(m=>m.id!==id);persist();render()}
function renderProgress(){let done=program.map((x,i)=>stat(i).done).reduce((a,b)=>a+b,0);return `<div class="grid"><div class="card"><div class="muted">Выполнено подходов за всё время</div><div class="stat">${done}</div></div><div class="card"><div class="muted">Дней с отметкой «завершено»</div><div class="stat">${Object.values(data.sessions).filter(s=>s.finished).length} / 3</div></div></div><div class="card"><h3>История веса</h3><div class="grid"><label>Вес, кг<input id="newWeight" type="number" step="0.1" value="${escapeHtml(data.profile.weight)}"></label><div class="actions"><button class="btn" onclick="addWeight()">Записать вес</button></div></div>${data.weights.slice().reverse().map(w=>`<p>${new Date(w.date).toLocaleDateString('ru-RU')} — <b>${escapeHtml(w.weight)} кг</b></p>`).join('')}</div><div class="card"><h3>История тренировок</h3>${(data.history||[]).length?data.history.slice().reverse().map(h=>`<p><b>День ${h.day}</b> · ${new Date(h.started).toLocaleString('ru-RU')} — ${new Date(h.finishedAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}<br><span class="muted">${h.done}/${h.total} подходов выполнено, ${h.skipped} пропущено</span></p>`).join(''):'<p class="muted">Заверши первую тренировку, чтобы она появилась здесь.</p>'}</div><div class="card photos"><h3>Фото до / после</h3><p class="muted">Фото сохраняются локально в браузере в сжатом виде. Для больших фото может не хватить места.</p><div class="grid">${['before','after'].map(k=>`<div><b>${k==='before'?'До':'После'}</b><p><input type="file" accept="image/*" onchange="photoUpload('${k}',this)"></p>${data.photos[k]?`<img src="${data.photos[k]}" alt="Фото ${k}">`:''}</div>`).join('')}</div></div><div class="actions"><button class="btn secondary" onclick="exportData()">Скачать резервную копию</button><label class="btn secondary" style="color:white;cursor:pointer">Импортировать JSON<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label></div>`}function addWeight(){let weight=document.getElementById('newWeight').value;if(!weight)return;data.weights.push({weight,date:new Date().toISOString()});data.profile.weight=weight;persist();render()}function photoUpload(which,input){let f=(input.files||[])[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,700/Math.max(img.width,img.height));c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);data.photos[which]=c.toDataURL('image/jpeg',.65);try{persist();render()}catch{toast('Фото слишком большое для хранилища браузера')}};img.src=reader.result};reader.readAsDataURL(f)}function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='FORMA-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u)}function importData(el){
 var f=(el.files||[])[0];if(!f)return;
 var reader=new FileReader();
 reader.onload=function(){try{
  var j=JSON.parse(reader.result);
  if(j.type==='FORMA_INBODY' && j.profile){
   Object.keys(j.profile).forEach(function(k){data.profile[k]=j.profile[k]});
   data.inbodyRecords=data.inbodyRecords||[];
   if(!data.inbodyRecords.some(function(r){return r.date===j.date}))data.inbodyRecords.push(j);
   if(!data.weights.some(function(w){return w.date.indexOf(j.date)===0}))data.weights.push({date:j.date+'T06:30:00',weight:j.profile.weight});
   persist();render();toast('InBody загружен без удаления тренировок');return;
  }
  if(!j.profile||!j.logs)throw Error('format');
  if(!confirm('Это полная резервная копия. Заменить текущие данные?'))return;
  data=j;data.inbodyRecords=data.inbodyRecords||[];persist();render();toast('Резервная копия импортирована');
 }catch(err){toast('Ошибка импорта JSON')}};
 reader.readAsText(f);
}

let audioCtx=null;
function unlockAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch{}}
function playEndSignal(){try{unlockAudio();if(audioCtx){[0,.23,.46].forEach((delay,i)=>{const t=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(i===2?1050:820,t);gain.gain.setValueAtTime(0.0001,t);gain.gain.exponentialRampToValueAtTime(.18,t+.018);gain.gain.exponentialRampToValueAtTime(.0001,t+.17);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.18)})}if(navigator.vibrate)navigator.vibrate([160,100,160])}catch{}}
function showExercise(d,e){let ex=program[d].ex[e],name=ex[0],lower=name.toLowerCase(),type=lower.includes('ног')||lower.includes('присед')||lower.includes('румынск')?'legs':lower.includes('тяга')||lower.includes('блок')?'pull':lower.includes('пресс')?'core':lower.includes('мах')||lower.includes('дельта')?'raise':'push';let equipments={legs:'Тренажёр / свободные веса',pull:'Тяговый тренажёр',core:'Коврик',raise:'Гантели / тренажёр',push:'Тренажёр / гантели'};let arm=type==='raise'?'M 104 103 L 64 77 M 176 103 L 216 77':type==='pull'?'M 104 105 L 73 137 M 176 105 L 207 137':type==='core'?'M 104 104 L 82 139 M 176 104 L 199 139':'M 104 104 L 76 80 M 176 104 L 204 80';let svg=`<svg viewBox="0 0 280 220" role="img" aria-label="Схематическая анимированная иллюстрация упражнения"><defs><linearGradient id="person" x1="0" x2="1"><stop stop-color="#d4ff75"/><stop offset="1" stop-color="#8dbd4b"/></linearGradient></defs><path d="M 32 190 H 247" stroke="#638354" stroke-width="4" stroke-linecap="round"/><g fill="none" stroke="#6c816d" stroke-width="5" stroke-linecap="round"><path d="M 26 80 V 190 M 254 80 V 190 M 26 80 H 254" opacity=".4"/></g><g class="figure" fill="none" stroke="url(#person)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"><circle cx="140" cy="64" r="18" fill="#caef8f" stroke="none"/><path d="M 140 92 V 146 M 140 146 L 107 191 M 140 146 L 173 191 ${arm}"/></g><path d="M 40 45 H 96 M 184 45 H 240" stroke="#caff45" stroke-width="3" stroke-dasharray="7 7" opacity=".6"/><text x="140" y="208" text-anchor="middle" fill="#c3d4b9" font-size="10">СХЕМА ДВИЖЕНИЯ · НЕ ФОТО</text></svg>`;document.getElementById('modalInner').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:start;gap:10px"><div><div class="muted small">ДЕНЬ ${d+1} · ${ex[2]}</div><h2>${escapeHtml(name)}</h2></div><button class="btn secondary" onclick="closeExercise()" aria-label="Закрыть">✕</button></div><div class="drawing">${svg}</div><b>Как выполнять</b><p>${escapeHtml(ex[3])}</p><p class="muted">Работают: ${escapeHtml(ex[2])}. Иллюстрация условная и не заменяет демонстрацию тренера.</p><button class="btn" style="width:100%" onclick="closeExercise()">Понятно, к подходам</button>`;document.getElementById('exerciseModal').classList.remove('hidden');}
function closeExercise(){document.getElementById('exerciseModal').classList.add('hidden')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeExercise()});
render();

let devMode=false;
function toggleDev(on){
  if(new URLSearchParams(location.search).has('preview')){alert('Режим разработчика открыт во внешнем окне.');return;}
  devMode=!!on;
  let sh=document.getElementById('developerShell');
  if(!sh){sh=document.createElement('div');sh.id='developerShell';document.body.appendChild(sh)}
  if(devMode){
    document.querySelector('header').style.display='none';document.querySelector('main').style.display='none';document.getElementById('bottomNav').style.display='none';
    document.getElementById('timer').classList.add('hidden');
    sh.style.display='block';
    sh.innerHTML=`<div class="dev-shell"><h1>⚙ Режим разработчика</h1><p>Проверяй внешний вид и нажимай на элементы прямо внутри телефона</p><div class="dev-toolbar"><button class="selected" onclick="devDevice(375,812,this)">iPhone X · 375×812</button><button onclick="devDevice(393,852,this)">iPhone Pro · 393×852</button><button onclick="devDevice(414,736,this)">iPhone 6 Plus · 414×736</button><button onclick="devRefresh()">↻ Обновить</button><button onclick="toggleDev(false)">← Обычный вид</button></div><div class="phone-stage"><div class="phone-case" id="devPhone"><iframe title="Предпросмотр FORMA на iPhone" id="devFrame" src="${location.pathname+location.search.replace(/([?&])preview=1(&|$)/,'$1').replace(/[?&]$/,'')+(location.search.includes('?')?'&':'?')+'preview=1'}"></iframe></div></div><p class="dev-note">Это браузерная имитация размеров экрана, не эмулятор Safari/iOS. Данные используют то же хранилище браузера, если браузер разрешает его для локальных файлов.</p></div>`;
    window.scrollTo(0,0)
  }else{
    sh.style.display='none';sh.innerHTML='';document.querySelector('header').style.display='';document.querySelector('main').style.display='';document.getElementById('bottomNav').style.display='';render();
  }
}
function devDevice(w,h,button){const box=document.getElementById('devPhone');box.style.width=w+'px';box.style.height=h+'px';document.querySelectorAll('.dev-toolbar button').forEach(b=>b.classList.remove('selected'));button.classList.add('selected')}
function devRefresh(){let f=document.getElementById('devFrame');if(f)f.contentWindow.location.reload()}
window.addEventListener('storage',e=>{if(e.key===key && !devMode){try{const saved=JSON.parse(e.newValue);if(saved){data=saved;render()}}catch{}}});
</script></body></html>
